[project]
name = "script2prompt"
version = "0.9.1"
description = "Translate movie scripts/screenplays into Minimax H3 video prompts"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
web = ["streamlit>=1.30"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["script2prompt*"]
