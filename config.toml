# Script2Prompt defaults (v1: mode is per-project).
# Override locally via config.local.toml or env vars
# (OPENAI_BASE_URL, S2P_MODEL, S2P_TEMPERATURE, S2P_TIMEOUT).
# Loaded with stdlib tomllib (no pyyaml needed).

[project]
mode = "T2VA"  # T2VA | I2VA | FL2VA | L2VA | R2V
duration = 8.0  # target seconds per chunk (cap 10.0)
shots_max = 3
style = "Live-action, cinematic"

[llm]
base_url = "http://localhost:11434/v1"
model = "local-model"
temperature = 0.3
max_tokens = 2048   # completion cap per chunk
timeout = 120       # per-request seconds
retries = 2         # transient-failure retries (5xx / network / timeout)
